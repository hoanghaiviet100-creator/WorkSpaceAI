name: workspaceai-f1-session-b
services:
  ollama:
    image: sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    pull_policy: never
    ports:
      - "127.0.0.1:18684:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 10m
      LLAMA_ARG_CACHE_RAM: "${F1_PROMPT_CACHE_MIB:-512}"
      LLAMA_ARG_CTX_CHECKPOINTS: "2"
      OLLAMA_NOPRUNE: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      GGML_CUDA_DISABLE_GRAPHS: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - type: bind
        source: ./.runtime/adaptive-models
        target: /models
      - type: bind
        source: ./.runtime/ollama-home
        target: /root/.ollama
    gpus: all
    mem_limit: 14g
    cpus: 4
    restart: "no"
