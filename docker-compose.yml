services:
  # ============================================================================
  # WorkspaceAI Backend Service (FastAPI)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspaceai-app
    ports:
      - "8000:8000"   # FastAPI REST API & Swagger UI (http://localhost:8000/docs)
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # Inside Docker network, use the internal service hostname "ollama".
      # If you wish to connect to Ollama running on your host machine instead,
      # set OLLAMA_DOCKER_URL=http://host.docker.internal:11434 in .env.
      - OLLAMA_BASE_URL=${OLLAMA_DOCKER_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_TAGS_CACHE_TTL=${OLLAMA_TAGS_CACHE_TTL:-60}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-3072}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-900}
      - OLLAMA_INCLUDE_THINKING=${OLLAMA_INCLUDE_THINKING:-true}
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-auto}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-intfloat/multilingual-e5-small}
      - FASTEMBED_CACHE_PATH=/var/cache/fastembed
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - RETRIEVAL_MIN_SCORE=${RETRIEVAL_MIN_SCORE:-0.35}
      - CITATION_VERIFY_THRESHOLD=${CITATION_VERIFY_THRESHOLD:-0.75}
      - EMAIL_DISPATCH_MODE=${EMAIL_DISPATCH_MODE:-gmail_real}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
    volumes:
      - fastembed_cache:/var/cache/fastembed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - workspaceai-net

  # ============================================================================
  # WorkspaceAI Frontend Service (React + Vite built & served by Nginx)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: workspaceai-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - workspaceai-net

  # ============================================================================
  # Local Ollama LLM Service (Runs Qwen2.5 / Llama models locally)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: workspaceai-ollama
    ports:
      - "11434:11434" # Ollama API endpoint (http://localhost:11434)
    environment:
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - workspaceai-net

volumes:
  ollama_models:
    name: workspaceai_ollama_models
  fastembed_cache:
    name: workspaceai_fastembed_cache

networks:
  workspaceai-net:
    name: workspaceai_network
    driver: bridge
